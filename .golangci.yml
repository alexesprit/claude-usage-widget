run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gofmt
    - goimports
    - govet
    - ineffassign
    - misspell
    - revive  # replaced golint
    - staticcheck
    - unused

linters-settings:
  revive:
    min-confidence: 0.8
  goimports:
    local-prefixes: github.com/alexesprit/claude-usage-widget